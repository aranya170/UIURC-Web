<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Robotics Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/includes/Icon.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hover-scale {
            transition: transform 0.3s ease;
        }

        .hover-scale:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="bg-[#EFEEEA] text-[#273F4F] min-h-screen">
    <div id="navbar"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-18 pb-10">
        <!-- Write your code here -->
        
    </main>
    <script>
        // Fetch and insert navbar
        document.addEventListener('DOMContentLoaded', () => {
            fetch('../includes/navbar.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load navbar');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar').innerHTML = data;
                })
                .catch(error => {
                    console.error('Error loading navbar:', error);
                    document.getElementById('navbar').innerHTML = '<p>Error loading navigation bar.</p>';
                });
        });

        
    </script>
</body>

</html>
